  <body>
    <div id="root"></div>
    <script>
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        window.onerror = function(message, source, lineno, colno, error) {
          document.body.innerHTML += '<div style="color:red; background:white; position:fixed; top:0; left:0; width:100%; height:100%; padding: 20px; z-index:9999;"><h1>Error</h1><p>' + message + '</p><pre>' + (error ? error.stack : '') + '</pre></div>';
        };
        window.addEventListener('unhandledrejection', function(event) {
          document.body.innerHTML += '<div style="color:red; background:white; position:fixed; top:0; left:0; width:100%; height:100%; padding: 20px; z-index:9999;"><h1>Unhandled Promise Rejection</h1><p>' + event.reason + '</p><pre>' + (event.reason ? event.reason.stack : '') + '</pre></div>';
        });
      }
    </script>
